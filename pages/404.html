<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blazor.Anime</title>
  <script>
    // GitHub Pages has no rewrite rules. A deep link such as /travel/place
    // returns this file and keeps the original URL. Send the app back to its
    // index with the route in ?p=, and the app restores the URL before Blazor starts.
    (function () {
      var base = "__BASE__";
      var path = location.pathname;
      if (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
      if (path.indexOf(base + "/") !== 0) return;
      var rest = path.slice(base.length);
      var match = /^\/(examples|travel)(\/.*)$/.exec(rest);
      if (!match) return;
      var tail = match[2];
      if (tail.length > 1 && tail.endsWith("/")) tail = tail.slice(0, -1);
      if (!/^\/[A-Za-z0-9/_-]+$/.test(tail) || tail.indexOf("..") !== -1) return;
      location.replace(base + "/" + match[1] + "/?p=" + encodeURIComponent(tail) + location.hash);
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: #12141c;
      color: #f4f1ea;
    }
    main { padding: 24px; }
    a { color: #7eebe6; }
  </style>
</head>
<body>
  <main>
    <p>That page is not part of the samples.</p>
    <p><a href="__BASE__/">Back to the samples</a></p>
  </main>
</body>
</html>
