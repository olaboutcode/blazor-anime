<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examples</title>
    <base href="/" />
    <script>
        // GitHub Pages serves a root 404 for deep links, which returns here as ?p=/route.
        // Rewrite that back before Blazor reads the URL. Local runs have no p parameter.
        (function () {
            var deep = new URLSearchParams(location.search).get("p");
            if (!deep) return;
            if (deep.charAt(0) !== "/") deep = "/" + deep;
            if (deep.length > 1 && deep.endsWith("/")) deep = deep.slice(0, -1);
            if (!/^\/[A-Za-z0-9/_-]+$/.test(deep) || deep.indexOf("..") !== -1) return;
            var base = document.querySelector("base");
            if (!base) return;
            var restored = new URL(deep.slice(1), new URL(base.getAttribute("href"), location.origin));
            history.replaceState(null, "", restored.pathname + location.hash);
        })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss" prefix(tw);
    </style>
    <link rel="stylesheet" href="css/documentation.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        window.docsCopy = function (text) {
            return navigator.clipboard.writeText(text);
        };
        window.docsScrollTo = function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            var scroller = el.closest(".docs-demos");
            if (!scroller) return;
            scroller.scrollTo({ top: el.offsetTop, behavior: "smooth" });
        };
        window.docsPointer = function (element, clientX, clientY) {
            var rect = element.getBoundingClientRect();
            var halfWidth = rect.width / 2;
            var halfHeight = rect.height / 2;
            var x = clientX - rect.left - halfWidth;
            var y = clientY - rect.top - halfHeight;
            return {
                x: Math.min(halfWidth, Math.max(-halfWidth, x)),
                y: Math.min(halfHeight, Math.max(-halfHeight, y)),
                width: rect.width,
                height: rect.height
            };
        };
        window.docsAngle = function (element, clientX, clientY) {
            var rect = element.getBoundingClientRect();
            return Math.atan2(clientY - rect.top - rect.height / 2, clientX - rect.left - rect.width / 2);
        };
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
