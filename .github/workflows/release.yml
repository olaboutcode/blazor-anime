name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Pack and push NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          dotnet pack src/BlazorAnime/BlazorAnime.csproj \
            -c Release \
            -o artifacts \
            -p:Version="$VERSION" \
            -p:PackageVersion="$VERSION"
          for project in Animatable Draggable Layout Scope Events Waapi Text; do
            dotnet pack "src/BlazorAnime.$project/BlazorAnime.$project.csproj" \
              -c Release \
              -o artifacts \
              -p:Version="$VERSION" \
              -p:PackageVersion="$VERSION"
          done

      - name: Check the packed files
        run: python3 scripts/check-nupkgs.py artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: olaboutcode

      - name: Push nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          core=$(find artifacts -type f -name 'BlazorAnime.*.nupkg' | grep -E '/BlazorAnime\.[0-9][^/]*\.nupkg$')
          test -n "$core"
          dotnet nuget push "$core" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
          find artifacts -type f -name 'BlazorAnime.*.nupkg' | grep -vE '/BlazorAnime\.[0-9][^/]*\.nupkg$' | sort | while read -r pkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json
          done
