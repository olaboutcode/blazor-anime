name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts/nupkg
      - name: Require the NuGet profile name
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "Set the NUGET_USER repository variable to the nuget.org profile name."
            exit 1
          fi
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          core=$(find artifacts/nupkg -type f -name 'BlazorAnime.*.nupkg' | grep -E '/BlazorAnime\.[0-9][^/]*\.nupkg$')
          test -n "$core"
          dotnet nuget push "$core" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          find artifacts/nupkg -type f -name 'BlazorAnime.*.nupkg' | grep -vE '/BlazorAnime\.[0-9][^/]*\.nupkg$' | sort | while read -r pkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done
