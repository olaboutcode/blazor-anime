name: CI

on:
  push:
    branches: [master, v4]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BlazorAnime.slnx
      - run: dotnet build BlazorAnime.slnx --no-restore --configuration Release
      - run: dotnet test test/BlazorAnime.Tests/BlazorAnime.Tests.csproj --no-build --configuration Release

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/interop/anime-interop.test.cjs

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix src/BlazorAnime/anime
      - run: npm run build --prefix src/BlazorAnime/anime
      - run: git diff --exit-code -- src/BlazorAnime/wwwroot/BlazorAnime.lib.module.js
      - run: node --test test/interop/anime-interop.test.cjs
      - name: Reject a root npm manifest
        run: test ! -e package.json && test ! -e package-lock.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore test/BlazorAnime.UiTests/BlazorAnime.UiTests.csproj
      - run: dotnet build test/BlazorAnime.UiTests/BlazorAnime.UiTests.csproj --no-restore --configuration Release
      - name: Install Chromium
        run: |
          driver="test/BlazorAnime.UiTests/bin/Release/net10.0/.playwright"
          node="$(find "$driver/node" -type f -name node | head -n 1)"
          "$node" "$driver/package/cli.js" install --with-deps chromium
      - run: dotnet test test/BlazorAnime.UiTests/BlazorAnime.UiTests.csproj --no-build --configuration Release
