name: CI

on:
  push:
    branches: [master, v4]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BlazorAnime.slnx
      - run: dotnet build BlazorAnime.slnx --no-restore --configuration Release
      - run: dotnet test test/BlazorAnime.Tests/BlazorAnime.Tests.csproj --no-build --configuration Release

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/interop/*.cjs

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix src/BlazorAnime/anime
      - run: npm run build --prefix src/BlazorAnime/anime
      - run: git add -N -- src/BlazorAnime/wwwroot src/BlazorAnime.Animatable/wwwroot src/BlazorAnime.Waapi/wwwroot src/BlazorAnime.Text/wwwroot && git diff --exit-code -- src/BlazorAnime/wwwroot src/BlazorAnime.Animatable/wwwroot src/BlazorAnime.Waapi/wwwroot src/BlazorAnime.Text/wwwroot
      - run: node --test test/interop/*.cjs
      - name: Reject a root npm manifest
        run: test ! -e package.json && test ! -e package-lock.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore test/BlazorAnime.UiTests/BlazorAnime.UiTests.csproj
      - run: dotnet build test/BlazorAnime.UiTests/BlazorAnime.UiTests.csproj --no-restore --configuration Release
      - name: Install Chromium
        run: |
          driver="test/BlazorAnime.UiTests/bin/Release/net10.0/.playwright"
          node="$(find "$driver/node" -type f -name node | head -n 1)"
          "$node" "$driver/package/cli.js" install --with-deps chromium
      - run: dotnet test test/BlazorAnime.UiTests/BlazorAnime.UiTests.csproj --no-build --configuration Release

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack the eight libraries
        run: |
          out="$GITHUB_WORKSPACE/artifacts/nupkg"
          mkdir -p "$out"
          dotnet pack src/BlazorAnime/BlazorAnime.csproj -c Release -o "$out"
          for project in Animatable Draggable Layout Scope Events Waapi Text; do
            dotnet pack "src/BlazorAnime.$project/BlazorAnime.$project.csproj" -c Release -o "$out"
          done
      - name: Check the packed files
        run: python3 scripts/check-nupkgs.py artifacts/nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/nupkg/*.nupkg

  publish:
    needs: [build-and-test, interop, bundle, browser, pack]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts/nupkg
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Add the NUGET_API_KEY repository secret before publishing."
            exit 1
          fi
          core=$(find artifacts/nupkg -type f -name 'BlazorAnime.*.nupkg' | grep -E '/BlazorAnime\.[0-9][^/]*\.nupkg$')
          test -n "$core"
          dotnet nuget push "$core" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          find artifacts/nupkg -type f -name 'BlazorAnime.*.nupkg' | grep -vE '/BlazorAnime\.[0-9][^/]*\.nupkg$' | sort | while read -r pkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done
